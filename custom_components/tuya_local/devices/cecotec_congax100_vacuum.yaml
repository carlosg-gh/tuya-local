name: Robot vacuum
products:
  - id: vmi5wjsg5yhprsvn
    manufacturer: Cecotec
    model: Conga X100
entities:
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: activate
      - id: 2
        type: boolean
        name: pause
        hidden: true
      - id: 4
        type: string
        name: command
        mapping:
          - dps_val: smart
            value: smart
          - dps_val: zone
            value: zone
          - dps_val: pose
            value: clean_spot
          - dps_val: part
            value: partial
          - dps_val: chargego
            value: return_to_base
          - dps_val: wallfollow
            value: wall_follow
          - dps_val: selectroom
            value: select_room
      - id: 5
        type: string
        name: status
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: smart
            value: smart
          - dps_val: zone_clean
            value: zone
          - dps_val: part_clean
            value: partial
          - dps_val: cleaning
            value: cleaning
          - dps_val: cleaning_mop
            value: cleaning
          - dps_val: moisturizing
            value: cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: seeking_spot
          - dps_val: pos_arrived
            value: located spot
          - dps_val: pos_unarrive
            value: left_spot
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: charged
          - dps_val: sleep
            value: sleep
          - dps_val: fault
            value: error
          - dps_val: wall_follow
            value: wall_following
          - dps_val: direction_control
            value: manual_positioning
          - dps_val: select_room
            value: selecting_room
          - dps_val: repositing
            value: repositioning
          - dps_val: cutting_hair
            value: docked
          - dps_val: amicro_collect_dust
            value: docked
          - dps_val: drying_mop
            value: docked
          - dps_val: goto_bs
            value: returning
      - id: 9
        type: string
        name: fan_speed
        mapping:
          - dps_val: gentle
            value: low
          - dps_val: normal
            value: medium
          - dps_val: strong
            value: high
          - dps_val: max
            value: turbo
      - id: 11
        type: boolean
        optional: true
        name: locate
      - id: 12
        type: string
        optional: true
        name: direction_control
        mapping:
          - dps_val: forward
            value: forward
          - dps_val: backward
            value: backward
          - dps_val: turn_left
            value: left
          - dps_val: turn_right
            value: right
          - dps_val: stop
            value: stop
  - entity: sensor
    class: battery
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: select
    translation_key: mopping
    category: config
    dps:
      - id: 10
        type: string
        name: option
        mapping:
          - dps_val: closed
            value: "off"
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high
  - entity: number
    translation_key: volume
    category: config
    dps:
      - id: 26
        type: integer
        name: value
        unit: "%"
        range:
          min: 0
          max: 100
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 28
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 28
        type: bitfield
        name: fault_code
  - entity: switch
    name: Custom mode
    category: config
    dps:
      - id: 105
        type: boolean
        name: switch

  - entity: sensor
    class: duration
    category: diagnostic
    dps:
      - id: 6
        type: integer
        optional: true
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    class: area
    category: diagnostic
    dps:
      - id: 7
        type: integer
        optional: true
        name: sensor
        unit: m2
        class: measurement
  - entity: binary_sensor
    name: Mop drying
    category: diagnostic
    dps:
      - id: 115
        type: boolean
        optional: true
        name: sensor
  - entity: sensor
    name: Time zone offset
    class: duration
    category: diagnostic
    dps:
      - id: 193
        type: integer
        optional: true
        name: sensor
        unit: min
  - entity: sensor
    name: Consumables raw
    category: diagnostic
    dps:
      - id: 195
        type: string
        optional: true
        name: sensor
  - entity: switch
    translation_key: do_not_disturb
    category: config
    dps:
      - id: 25
        type: boolean
        optional: true
        name: switch
  - entity: switch
    name: Resume clean
    category: config
    dps:
      - id: 27
        type: boolean
        optional: true
        name: switch
  - entity: sensor
    name: Total clean area
    class: area
    category: diagnostic
    dps:
      - id: 29
        type: integer
        optional: true
        name: sensor
        unit: m2
        class: total_increasing
  - entity: sensor
    name: Number of cleans
    category: diagnostic
    dps:
      - id: 30
        type: integer
        optional: true
        name: sensor
        unit: times
        class: total_increasing
  - entity: sensor
    name: Total cleaning time
    class: duration
    category: diagnostic
    dps:
      - id: 31
        type: integer
        optional: true
        name: sensor
        unit: min
        class: total_increasing
  - entity: select
    translation_key: language
    category: config
    dps:
      - id: 36
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: chinese_simplified
            value: chinese
          - dps_val: english
            value: english
          - dps_val: french
            value: french
          - dps_val: spanish
            value: spanish
          - dps_val: portuguese
            value: portuguese
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 47
        type: boolean
        name: lock
  - entity: sensor
    name: Alert code
    category: diagnostic
    dps:
      - id: 186
        type: integer
        optional: true
        name: sensor
  - entity: binary_sensor
    name: Alert
    class: problem
    category: diagnostic
    dps:
      - id: 186
        type: integer
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 171
        type: string
        optional: true
        name: flags
  - entity: switch
    name: Turbo on carpets
    category: config
    dps:
      - id: 45
        type: boolean
        name: switch
  - entity: switch
    name: Mop to edge
    category: config
    dps:
      - id: 107
        type: boolean
        name: switch
  - entity: switch
    name: Remove mop on carpets
    category: config
    dps:
      - id: 110
        type: boolean
        name: switch
  - entity: switch
    name: Hair cut
    category: config
    dps:
      - id: 173
        type: boolean
        name: switch
  - entity: select
    name: Carpet strategy
    category: config
    dps:
      - id: 44
        type: string
        name: option
        mapping:
          - dps_val: evade
            value: avoid
          - dps_val: ignore
            value: ignore
          - dps_val: only
            value: carpet only
          - dps_val: adaptive
            value: adaptive
  - entity: select
    name: Hair cut duration
    category: config
    dps:
      - id: 119
        type: integer
        name: option
        mapping:
          - dps_val: 1
            value: 30 seconds
          - dps_val: 2
            value: 1 minute
          - dps_val: 3
            value: 2 minutes
  - entity: select
    name: Wash interval
    category: config
    dps:
      - id: 175
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: 5 minutes
          - dps_val: "1"
            value: 10 minutes
          - dps_val: "2"
            value: 15 minutes
          - dps_val: "3"
            value: 20 minutes
          - dps_val: "4"
            value: 25 minutes
  - entity: select
    name: Mop wash temperature
    category: config
    dps:
      - id: 176
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: normal
          - dps_val: "1"
            value: warm
          - dps_val: "2"
            value: high
          - dps_val: "3"
            value: smart
  - entity: select
    name: Auto-dry
    category: config
    dps:
      - id: 109
        type: string
        name: option
        mapping:
          - dps_val: hotoff
            value: "off"
          - dps_val: hoton
            value: "on"
  - entity: select
    name: Dry duration
    category: config
    dps:
      - id: 156
        type: string
        name: option
        mapping:
          - dps_val: low
            value: 2 hours
          - dps_val: middle
            value: 3 hours
          - dps_val: high
            value: 4 hours
  - entity: select
    name: Auto-empty
    category: config
    dps:
      - id: 37
        type: integer
        name: option
        mapping:
          - dps_val: 0
            value: "off"
          - dps_val: 1
            value: regular
          - dps_val: 2
            value: low
  - entity: switch
    name: AI obstacle avoidance
    category: config
    dps:
      - id: 116
        type: boolean
        name: switch
  - entity: switch
    name: AI real photos
    category: config
    dps:
      - id: 122
        type: boolean
        name: switch
  - entity: switch
    name: AI pet environment
    category: config
    dps:
      - id: 117
        type: boolean
        name: switch
  - entity: switch
    name: Clean stains
    category: config
    dps:
      - id: 114
        type: boolean
        name: switch
  - entity: switch
    name: Auto light
    category: config
    dps:
      - id: 118
        type: boolean
        name: switch
